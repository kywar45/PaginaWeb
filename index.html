<!doctype html>
<html lang="es-MX">
  <head>
    <title><%= seoHome.title %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= seoHome.description %>" />
    <meta name="author" content="Importadora Supernova" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="<%= seoHome.url %>" />
    <meta name="application-name" content="Importadora Supernova" />
    <meta name="store-base-url" content="<%= seoHome.url %>" />
    <meta name="apple-mobile-web-app-title" content="Supernova" />
    <meta name="theme-color" content="#f43f6f" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="Importadora Supernova" />
    <meta property="og:title" content="<%= seoHome.title %>" />
    <meta property="og:description" content="<%= seoHome.description %>" />
    <meta property="og:image" content="<%= seoHome.image %>" />
    <meta property="og:url" content="<%= seoHome.url %>" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="<%= seoHome.title %>" />
    <meta name="twitter:description" content="<%= seoHome.description %>" />
    <meta name="twitter:image" content="<%= seoHome.image %>" />
    <script id="store-structured-data" type="application/ld+json"><%= serializeSchema(seoHome.graph) %></script>
    <% if (ctx.prod) { %>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9BG23LE340"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-9BG23LE340', { send_page_view: false });
    </script>
    <% } %>
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <link rel="icon" type="image/png" href="icons/supernova.png" />
    <link rel="apple-touch-icon" href="icons/supernova.png" />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>

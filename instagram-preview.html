<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prueba de Reel de Instagram</title>
    <style>
      body { margin: 0; background: #fff8fa; color: #292126; font: 16px/1.5 Arial, sans-serif; }
      main { width: min(100% - 32px, 720px); margin: 35px auto; }
      h1 { font-size: 22px; }
      .reel { width: min(100%, 350px); overflow: hidden; border: 1px solid #f0dce3; border-radius: 12px; background: #fff; }
      iframe { display: block; width: 100%; height: 600px; border: 0; }
      a { color: #c62d5e; }
    </style>
  </head>
  <body>
    <main>
      <h1>Prueba de Reel de Instagram</h1>
      <p>Vista de prueba independiente; no cambia el carrusel de la tienda.</p>
      <div class="reel">
        <iframe src="https://www.instagram.com/reel/DffWdm_DBgV/embed/" title="Reel de Instagram de Supernova" allow="encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
      </div>
      <p><a href="https://www.instagram.com/reel/DffWdm_DBgV/" target="_blank" rel="noopener noreferrer">Abrir publicación en Instagram</a></p>
    </main>
  </body>
</html>
